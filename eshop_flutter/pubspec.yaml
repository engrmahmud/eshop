name: eshop_flutter
description: A new Flutter project with Serverpod.


publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: '^3.8.0'
  flutter: '^3.32.0'

resolution: workspace

dependencies:
 
  cupertino_icons: ^1.0.5
  flutter:
    sdk: flutter
  eshop_client:
    path: ../eshop_client
  serverpod_flutter: 3.3.1
  serverpod_auth_idp_flutter: 3.3.1
  get_it: ^9.2.1
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  dartz: ^0.10.1
  go_router: ^17.1.0
  image_picker: ^1.2.1
  dio: ^5.9.2
  carousel_slider: ^5.1.2




dev_dependencies:
  flutter_lints: '>=3.0.0 <7.0.0'
  flutter_test:
    sdk: flutter


flutter:

  uses-material-design: true

  assets:
    - assets/images/banner/
    - assets/images/
    - assets/config.json
  # To add custom fonts to your application, add a fonts section here,
