services:
  # Development services
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: eshop
      POSTGRES_PASSWORD: "uckZrpRiwWNX0ZuBSxfafbQQ5omDyUEc"
    volumes:
      - eshop_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "Gx7_jybhvSeB0-bkMnvykzwbeYgwnmQr"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: pgvector/pgvector:pg16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: eshop_test
      POSTGRES_PASSWORD: "l4nDFPmPmERsmz31LgoPXm409Zb_irBm"
    volumes:
      - eshop_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "bEflSrccveA-ANW_dXQix5djwrQGi_7e"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  eshop_data:
  eshop_test_data:
